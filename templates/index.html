<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omaha Garage Sale Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
    <script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
    <script>
        (function () {
            var savedTheme = localStorage.getItem("garage-sale-theme");
            if (savedTheme === "light") {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="header-bar">
            <span class="version-tag">v{{ version }}</span>
            <button type="button" id="theme-toggle" class="theme-toggle">Change Theme</button>
        </div>
        <h1>Omaha Garage Sale Finder</h1>
        <p class="subtitle">Today's garage &amp; moving sales near you, sorted by distance.</p>
    </header>

    <main>
        <section id="map-section" class="map-section">
            <div class="map-header">
                <h2>Map of all sales</h2>
                <button type="button" id="map-toggle" class="map-toggle">Hide map</button>
            </div>
            <div id="map" class="map-container"></div>
        </section>

        <form id="search-form">
            <label for="address">Your address</label>
            <div class="address-wrapper">
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="e.g. 123 Main St, Omaha, NE"
                    autocomplete="off"
                    required
                >
                <ul id="autocomplete-list" class="autocomplete-items"></ul>
            </div>
            <div class="day-toggle" role="group" aria-label="Choose day">
                <button type="button" class="day-option active" data-day="today">Today</button>
                <button type="button" class="day-option" data-day="tomorrow">Tomorrow</button>
            </div>
            <button type="submit">Find Garage Sales</button>
        </form>

        <div id="status"></div>

        <div id="filter-wrapper" class="filter-wrapper" hidden>
            <input
                type="text"
                id="keyword-filter"
                placeholder="Filter by keyword (e.g. tools, kids clothes, furniture)"
                autocomplete="off"
            >
        </div>

        <ul id="results"></ul>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}?v={{ version }}"></script>
</body>
</html>
